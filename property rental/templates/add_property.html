<!DOCTYPE html>
<html>

<head>

    <title>List Property</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <h1>List Your Property</h1>


    <form method="POST">

        <label>Property Title</label>

        <input
            type="text"
            name="title"
            placeholder="Example: 2BHK Apartment"
            required
        >


        <label>Location</label>

        <input
            type="text"
            name="location"
            placeholder="Example: Chennai"
            required
        >


        <label>Property Type</label>

        <select name="property_type" required>

            <option value="">
                Select Type
            </option>

            <option value="Apartment">
                Apartment
            </option>

            <option value="House">
                House
            </option>

            <option value="Room">
                Room
            </option>

            <option value="Villa">
                Villa
            </option>

        </select>


        <label>Monthly Rent</label>

        <input
            type="number"
            name="price"
            placeholder="Monthly rent"
            required
        >


        <label>Number of Bedrooms</label>

        <input
            type="number"
            name="bedrooms"
            placeholder="Bedrooms"
            required
        >


        <label>Description</label>

        <textarea
            name="description"
            placeholder="Describe the property"
            required
        ></textarea>


        <button type="submit">
            Add Property
        </button>

    </form>

</div>

</body>

</html>
